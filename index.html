 </div>

 
       <!-- BOTÓN PARA ACTIVAR LA MÚSICA -->
<button id="boton-musica" class="boton-musica">
    ✨ Tócame ✨
</button>

<audio id="musica" loop>
    <source src="f-a.mp3" type="audio/mpeg">
</audio>




<script>
const boton = document.getElementById("boton-musica");
const musica = document.getElementById("musica");

boton.addEventListener("click", () => {
    if (musica.paused) {
        // play() devuelve una Promesa
        musica.play()
            .then(() => {
                boton.textContent = "♫ Reproduciendo ♫";
            })
            .catch(error => {
                console.error("Error al intentar reproducir audio:", error);
                alert("No se pudo reproducir el audio. Revisa la consola o la ruta del archivo.");
            });
    } else {
        musica.pause();
        boton.textContent = "✨ Tócame ✨";
    }
});
</script>
